<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Deep Ocean XAT</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}


/* =========================
   GLAVNO MORE
========================= */

.ocean{

    position:fixed;
    inset:0;

    overflow:hidden;

    background:
    radial-gradient(
        ellipse at 50% 10%,
        rgba(0,180,240,.35),
        transparent 45%
    ),
    linear-gradient(
        180deg,
        #006fa8 0%,
        #00466f 35%,
        #002c4a 70%,
        #00101e 100%
    );

}



/* =========================
   BLAGA SVETLOST KROZ VODU
   (bez linija)
========================= */


.water-light{

position:absolute;

top:-40%;
left:-30%;

width:160%;
height:120%;


background:

radial-gradient(
ellipse,
rgba(255,255,255,.12),
transparent 55%
);


animation:
waterGlow 18s infinite alternate;

pointer-events:none;

}



@keyframes waterGlow{


0%{

transform:
translate(-50px,0)
scale(1);

opacity:.35;

}


100%{

transform:
translate(80px,40px)
scale(1.2);

opacity:.6;

}

}





/* =========================
   DUBINA
========================= */


.depth{


position:absolute;

inset:0;


background:

radial-gradient(
ellipse at center,
transparent 30%,
rgba(0,0,0,.65)
);


pointer-events:none;

z-index:20;

}




/* =========================
   MEHURICI
========================= */


.bubble{


position:absolute;

bottom:-50px;

border-radius:50%;


background:
rgba(180,235,255,.18);


border:
1px solid rgba(255,255,255,.25);


box-shadow:
0 0 12px rgba(0,180,255,.4);


animation:
bubbleUp linear infinite;


z-index:15;

}



@keyframes bubbleUp{


0%{

transform:
translateY(0)
translateX(0)
scale(.7);

opacity:0;

}


20%{

opacity:.8;

}


100%{

transform:

translateY(-120vh)
translateX(60px)
scale(1.2);

opacity:0;

}


}


.b1{
width:12px;
height:12px;
left:15%;
animation-duration:18s;
}


.b2{
width:25px;
height:25px;
left:35%;
animation-duration:28s;
}


.b3{
width:8px;
height:8px;
left:60%;
animation-duration:14s;
}


.b4{
width:18px;
height:18px;
left:82%;
animation-duration:22s;
}





/* =========================
   MORSKE ZIVOTINJE
========================= */


.creature{


position:absolute;

pointer-events:none;

z-index:10;


filter:
drop-shadow(
0 0 8px rgba(0,180,255,.45)
);


}



/* 01 */

.c01{

width:100px;

animation:
swim01 42s infinite ease-in-out;

}


@keyframes swim01{

0%{
left:-10%;
top:30%;
}

25%{
left:25%;
top:20%;
}

50%{
left:55%;
top:35%;
}

75%{
left:80%;
top:25%;
}

100%{
left:110%;
top:40%;
}

}




/* 02 */

.c02{

width:140px;

animation:
swim02 55s infinite ease-in-out;

}


@keyframes swim02{


0%{
left:110%;
top:60%;
}


30%{
left:75%;
top:45%;
}


60%{
left:35%;
top:65%;
}


100%{
left:-20%;
top:50%;
}


}




/* 03 dubina */

.c03{

width:260px;

opacity:.45;

animation:
swim03 90s infinite linear;

}



@keyframes swim03{


0%{
left:-30%;
top:70%;
}


50%{
left:45%;
top:60%;
}


100%{
left:120%;
top:75%;
}


}




/* 04 */

.c04{

width:90px;

animation:
swim04 38s infinite ease-in-out;

}


@keyframes swim04{


0%{
left:10%;
top:80%;
}


50%{
left:60%;
top:55%;
}


100%{
left:100%;
top:75%;
}


}





/* 05 */

.c05{

width:170px;

animation:
swim05 70s infinite ease-in-out;

}


@keyframes swim05{


0%{
left:-20%;
top:45%;
}


40%{
left:40%;
top:30%;
}


80%{
left:80%;
top:50%;
}


100%{
left:120%;
top:40%;
}


}





/* 06 */

.c06{

width:120px;

animation:
swim06 60s infinite ease-in-out;

}


@keyframes swim06{


0%{
left:100%;
top:20%;
}


50%{
left:50%;
top:40%;
}


100%{
left:-20%;
top:25%;
}


}




/* 07 */

.c07{

width:220px;

opacity:.55;

animation:
swim07 100s infinite linear;

}


@keyframes swim07{


0%{
left:-40%;
top:20%;
}


100%{
left:120%;
top:35%;
}


}





/* 08 */

.c08{

width:110px;

animation:
swim08 50s infinite ease-in-out;

}


@keyframes swim08{


0%{
left:80%;
top:80%;
}


50%{
left:40%;
top:55%;
}


100%{
left:-20%;
top:70%;
}


}





/* 09 */

.c09{

width:130px;

animation:
swim09 65s infinite ease-in-out;

}


@keyframes swim09{


0%{
left:-20%;
top:60%;
}


50%{
left:60%;
top:75%;
}


100%{
left:110%;
top:50%;
}


}





/* 10 */

.c10{

width:160px;

animation:
swim10 75s infinite ease-in-out;

}


@keyframes swim10{


0%{
left:120%;
top:15%;
}


50%{
left:50%;
top:35%;
}


100%{
left:-20%;
top:20%;
}


}



</style>

</head>


<body>


<div class="ocean">


<div class="water-light"></div>



<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>
<div class="bubble b4"></div>



<img class="creature c01" src="https://i.imgur.com/AaEWDOs.gif">

<img class="creature c02" src="https://i.imgur.com/3fe3rwn.gif">

<img class="creature c03" src="https://i.imgur.com/PBlkcyw.gif">

<img class="creature c04" src="https://i.imgur.com/2fCJYbt.gif">

<img class="creature c05" src="https://i.imgur.com/MOmJ9VR.gif">

<img class="creature c06" src="https://i.imgur.com/awkNxXg.gif">

<img class="creature c07" src="https://i.imgur.com/NkT0j9G.gif">

<img class="creature c08" src="https://i.imgur.com/ljHMWjF.gif">

<img class="creature c09" src="https://i.imgur.com/QQGiehf.gif">

<img class="creature c10" src="https://i.imgur.com/AqgYZlO.gif">

<img class="creature c05" src="https://i.imgur.com/YgI0sf7.gif">

<img class="creature c06" src="https://i.imgur.com/9im4MOK.gif">

<img class="creature c08" src="https://i.imgur.com/z494fsE.gif">

<img class="creature c07" src="https://i.imgur.com/VZmMgnR.gif">



<div class="depth"></div>


</div>


</body>
</html>
