<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Deep Ocean XAT - Radio Galaksija</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* ====================================
   POZICIJA LINKA: 50% visine, 50px left
====================================== */
.top-link-container {
    position: fixed;
    top: 50%;
    left: 50px;
    transform: translateY(-50%); 
    z-index: 9999;
    display: inline-block;
    pointer-events: none;   
}

.premium-link {
    color: #ff6a00;
    font-size: 22px;
    font-weight: 900;
    text-transform: uppercase;
    text-decoration: none;
    letter-spacing: 3px;
    pointer-events: auto;
    text-shadow: 
        0 0 10px #ff6a00,
        0 0 20px #ff3300,
        0 0 40px #000,
        0 0 5px #000;
    transition: all 0.3s ease;
    animation: linkPulse 2.5s infinite ease-in-out;
}

@keyframes linkPulse {
    0%, 100% { transform: scale(1); opacity: 0.95; }
    50% { transform: scale(1.03); opacity: 1; }
}

/* =========================
   GLAVNO MORE
========================= */
.ocean {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
    radial-gradient(ellipse at 50% 10%, rgba(0,180,240,.35), transparent 45%),
    linear-gradient(180deg, #006fa8 0%, #00466f 35%, #002c4a 70%, #00101e 100%);
}

.water-light {
    position: absolute;
    top: -40%; left: -30%; width: 160%; height: 120%;
    background: radial-gradient(ellipse, rgba(255,255,255,.12), transparent 55%);
    animation: waterGlow 18s infinite alternate;
    pointer-events: none;
}

@keyframes waterGlow {
    0% { transform: translate(-50px, 0) scale(1); opacity: .35; }
    100% { transform: translate(80px, 40px) scale(1.2); opacity: .6; }
}

.depth {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.65));
    pointer-events: none; z-index: 20;
}

/* =========================
   MEHURIĆI (Prirodno njihanje)
========================= */
.bubble {
    position: absolute; bottom: -60px; border-radius: 50%;
    background: rgba(180,235,255,.18); border: 1px solid rgba(255,255,255,.3);
    box-shadow: 0 0 12px rgba(0,180,255,.4); animation: bubbleUp linear infinite;
    z-index: 15;
}

@keyframes bubbleUp {
    0% { transform: translateY(0) translateX(0) scale(.7); opacity: 0; }
    10% { opacity: .8; }
    33% { transform: translateY(-40vh) translateX(-30px) scale(0.9); }
    66% { transform: translateY(-80vh) translateX(30px) scale(1.1); }
    100% { transform: translateY(-120vh) translateX(-10px) scale(1.2); opacity: 0; }
}

.b1 { width: 12px; height: 12px; left: 15%; animation-duration: 18s; }
.b2 { width: 25px; height: 25px; left: 35%; animation-duration: 28s; }
.b3 { width: 8px; height: 8px; left: 60%; animation-duration: 14s; }
.b4 { width: 18px; height: 18px; left: 82%; animation-duration: 22s; }

/* ====================================================
   HAOTIČAN MORSKI SVET (Kretanje u svim pravcima)
====================================================== */
.creature {
    position: absolute; 
    pointer-events: none; 
    filter: drop-shadow(0 0 8px rgba(0,180,255,.45));
    will-change: transform, left, top;
}

/* --- GRUPA 1: Kretanje s leva na desno sa poniranjem --- */
.c01 { width: 100px; z-index: 12; animation: swim01 38s infinite ease-in-out; }
@keyframes swim01 {
    0% { left: -15%; top: 20%; transform: scaleX(1); }
    25% { left: 20%; top: 45%; }
    50% { left: 55%; top: 15%; }
    75% { left: 80%; top: 50%; }
    100% { left: 115%; top: 25%; transform: scaleX(1); }
}

.c03 { width: 240px; opacity: .45; z-index: 8; animation: swim03 75s infinite linear; }
@keyframes swim03 {
    0% { left: -30%; top: 75%; }
    33% { left: 20%; top: 55%; }
    66% { left: 70%; top: 80%; }
    100% { left: 120%; top: 60%; }
}

.c04 { width: 90px; z-index: 14; animation: swim04 32s infinite ease-in-out; }
@keyframes swim04 {
    0% { left: -12%; top: 80%; }
    30% { left: 35%; top: 40%; }
    70% { left: 70%; top: 75%; }
    100% { left: 112%; top: 35%; }
}

.c05 { width: 160px; z-index: 11; animation: swim05 50s infinite ease-in-out; }
@keyframes swim05 {
    0% { left: -20%; top: 40%; }
    25% { left: 30%; top: 15%; }
    55% { left: 60%; top: 60%; }
    80% { left: 90%; top: 30%; }
    100% { left: 120%; top: 45%; }
}

.c07 { width: 210px; opacity: .6; z-index: 9; animation: swim07 85s infinite linear; }
@keyframes swim07 {
    0% { left: -35%; top: 15%; }
    50% { left: 45%; top: 45%; }
    100% { left: 125%; top: 20%; }
}

.c09 { width: 130px; z-index: 13; animation: swim09 45s infinite ease-in-out; }
@keyframes swim09 {
    0% { left: -15%; top: 65%; }
    40% { left: 40%; top: 85%; }
    75% { left: 80%; top: 50%; }
    100% { left: 115%; top: 70%; }
}

/* --- GRUPA 2: Kretanje s desna na levo (Invertovan scaleX) --- */
.c02 { width: 130px; z-index: 12; animation: swim02 48s infinite ease-in-out; }
@keyframes swim02 {
    0% { left: 115%; top: 55%; transform: scaleX(-1); }
    30% { left: 80%; top: 20%; }
    65% { left: 40%; top: 70%; }
    100% { left: -15%; top: 40%; transform: scaleX(-1); }
}

.c06 { width: 110px; z-index: 10; animation: swim06 55s infinite ease-in-out; }
@keyframes swim06 {
    0% { left: 112%; top: 25%; transform: scaleX(-1); }
    25% { left: 85%; top: 55%; }
    50% { left: 50%; top: 15%; }
    75% { left: 20%; top: 45%; }
    100% { left: -12%; top: 30%; transform: scaleX(-1); }
}

.c08 { width: 105px; z-index: 14; animation: swim08 42s infinite ease-in-out; }
@keyframes swim08 {
    0% { left: 115%; top: 85%; transform: scaleX(-1); }
    40% { left: 65%; top: 50%; }
    75% { left: 30%; top: 80%; }
    100% { left: -15%; top: 60%; transform: scaleX(-1); }
}

.c10 { width: 150px; z-index: 11; animation: swim10 60s infinite ease-in-out; }
@keyframes swim10 {
    0% { left: 118%; top: 10%; transform: scaleX(-1); }
    50% { left: 50%; top: 40%; }
    100% { left: -18%; top: 15%; transform: scaleX(-1); }
}

/* --- GRUPA 3: Kompleksne cik-cak i kružne putanje (Okretanje u hodu) --- */
.c11 { width: 140px; z-index: 13; animation: swim11 52s infinite ease-in-out; }
@keyframes swim11 {
    0% { left: -15%; top: 30%; transform: scaleX(1); }
    35% { left: 50%; top: 75%; transform: scaleX(1); }
    40% { left: 48%; top: 73%; transform: scaleX(-1); } /* Blagi okret nazad */
    70% { left: 15%; top: 40%; transform: scaleX(-1); }
    75% { left: 18%; top: 42%; transform: scaleX(1); }  /* Ponovni okret napred */
    100% { left: 115%; top: 50%; transform: scaleX(1); }
}

.c12 { width: 120px; z-index: 10; animation: swim12 46s infinite ease-in-out; }
@keyframes swim12 {
    0% { left: 115%; top: 70%; transform: scaleX(-1); }
    30% { left: 60%; top: 30%; transform: scaleX(-1); }
    60% { left: 15%; top: 65%; transform: scaleX(-1); }
    65% { left: 18%; top: 63%; transform: scaleX(1); }  /* Okret desno */
    85% { left: 45%; top: 45%; transform: scaleX(1); }
    100% { left: -15%; top: 80%; transform: scaleX(-1); }
}

.c13 { width: 110px; z-index: 15; animation: swim13 58s infinite ease-in-out; }
@keyframes swim13 {
    0% { left: 115%; top: 45%; transform: scaleX(-1); }
    25% { left: 75%; top: 80%; }
    50% { left: 35%; top: 35%; }
    75% { left: 10%; top: 65%; }
    100% { left: -15%; top: 50%; transform: scaleX(-1); }
}

.c14 { width: 190px; opacity: .5; z-index: 7; animation: swim14 90s infinite linear; }
@keyframes swim14 {
    0% { left: -30%; top: 50%; }
    50% { left: 45%; top: 80%; }
    100% { left: 125%; top: 45%; }
}
</style>
</head>

<body>
