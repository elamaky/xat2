<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Ocean XAT</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* ====================================
   POZICIJA DUGMETA: 50% visine, 50px left
====================================== */
.top-link-container {
    position: fixed;
    top: 50%;
    left: 50px;
    transform: translateY(-50%); 
    z-index: 9999;
    display: inline-block;
    pointer-events: none;   
}

.premium-link {
    color: #ff6a00;
    font-size: 22px;
    font-weight: 900;
    text-transform: uppercase;
    text-decoration: none;
    letter-spacing: 3px;
    pointer-events: auto;
    text-shadow: 
        0 0 10px #ff6a00,
        0 0 20px #ff3300,
        0 0 40px #000,
        0 0 5px #000;
    transition: all 0.3s ease;
    animation: linkPulse 2.5s infinite ease-in-out;
}

@keyframes linkPulse {
    0%, 100% { transform: scale(1); opacity: 0.95; }
    50% { transform: scale(1.03); opacity: 1; }
}

/* =========================
   GLAVNO MORE
========================= */
.ocean{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
    radial-gradient(ellipse at 50% 10%, rgba(0,180,240,.35), transparent 45%),
    linear-gradient(180deg, #006fa8 0%, #00466f 35%, #002c4a 70%, #00101e 100%);
}

.water-light{
    position:absolute;
    top:-40%; left:-30%; width:160%; height:120%;
    background: radial-gradient(ellipse, rgba(255,255,255,.12), transparent 55%);
    animation: waterGlow 18s infinite alternate;
    pointer-events:none;
}

@keyframes waterGlow{
    0%{ transform: translate(-50px,0) scale(1); opacity:.35; }
    100%{ transform: translate(80px,40px) scale(1.2); opacity:.6; }
}

.depth{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.65));
    pointer-events:none; z-index:20;
}

/* =========================
   MEHURIĆI
========================= */
.bubble{
    position:absolute; bottom:-50px; border-radius:50%;
    background: rgba(180,235,255,.18); border: 1px solid rgba(255,255,255,.25);
    box-shadow: 0 0 12px rgba(0,180,255,.4); animation: bubbleUp linear infinite;
    z-index:15;
}

@keyframes bubbleUp{
    0% { transform: translateY(0) translateX(0) scale(.7); opacity: 0; }
    10% { opacity: .8; }
    33% { transform: translateY(-40vh) translateX(-30px) scale(0.9); }
    66% { transform: translateY(-80vh) translateX(30px) scale(1.1); }
    100% { transform: translateY(-120vh) translateX(-10px) scale(1.2); opacity: 0; }
}

.b1{ width:12px; height:12px; left:15%; animation-duration:18s; }
.b2{ width:25px; height:25px; left:35%; animation-duration:28s; }
.b3{ width:8px; height:8px; left:60%; animation-duration:14s; }
.b4{ width:18px; height:18px; left:82%; animation-duration:22s; }

/* ====================================================
   HAOTIČNE PUTANJE BEZ PRAVILA I BEZ PREKLAPANJA
====================================================== */
.creature{
    position:absolute; pointer-events:none; z-index:10;
    filter: drop-shadow(0 0 8px rgba(0,180,255,.45));
    will-change: transform, left, top;
}

.c01{ width:100px; animation: swim01 42s infinite ease-in-out; }
@keyframes swim01{
    0%{ left:-10%; top:30%; }
    33%{ left:30%; top:15%; }
    66%{ left:70%; top:45%; }
    100%{ left:110%; top:40%; }
}

.c02{ width:140px; animation: swim02 55s infinite ease-in-out; }
@keyframes swim02{
    0%{ left:110%; top:60%; transform: scaleX(-1); }
    50%{ left:45%; top:25%; }
    100%{ left:-20%; top:50%; transform: scaleX(-1); }
}

.c03{ width:260px; opacity:.45; animation: swim03 90s infinite linear; }
@keyframes swim03{
    0%{ left:-30%; top:70%; }
    50%{ left:45%; top:55%; }
    100%{ left:120%; top:75%; }
}

.c04{ width:90px; animation: swim04 38s infinite ease-in-out; }
@keyframes swim04{
    0%{ left:-10%; top:80%; }
    40%{ left:50%; top:35%; }
    100%{ left:110%; top:75%; }
}

/* Prva slika c05 */
img.c05:nth-of-type(1) { width:170px; animation: swim05_1 60s infinite ease-in-out; }
@keyframes swim05_1{
    0%{ left:-20%; top:45%; }
    33%{ left:40%; top:20%; }
    66%{ left:80%; top:70%; }
    100%{ left:120%; top:40%; }
}

/* Prva slika c06 */
img.c06:nth-of-type(1) { width:120px; animation: swim06_1 58s infinite ease-in-out; }
@keyframes swim06_1{
    0%{ left:110%; top:20%; transform: scaleX(-1); }
    50%{ left:50%; top:65%; }
    100%{ left:-20%; top:25%; transform: scaleX(-1); }
}

/* Prva slika c07 */
img.c07:nth-of-type(1) { width:220px; opacity:.55; animation: swim07_1 100s infinite linear; }
@keyframes swim07_1{
    0%{ left:-40%; top:20%; }
    50%{ left:40%; top:50%; }
    100%{ left:120%; top:35%; }
}

/* Prva slika c08 */
img.c08:nth-of-type(1) { width:110px; animation: swim08_1 50s infinite ease-in-out; }
@keyframes swim08_1{
    0%{ left:110%; top:80%; transform: scaleX(-1); }
    50%{ left:40%; top:30%; }
    100%{ left:-20%; top:70%; transform: scaleX(-1); }
}

.c09{ width:130px; animation: swim09 65s infinite ease-in-out; }
@keyframes swim09{
    0%{ left:-20%; top:60%; }
    50%{ left:60%; top:35%; }
    100%{ left:110%; top:50%; }
}

.c10{ width:160px; animation: swim10 75s infinite ease-in-out; }
@keyframes swim10{
    0%{ left:120%; top:15%; transform: scaleX(-1); }
    50%{ left:50%; top:50%; }
    100%{ left:-20%; top:20%; transform: scaleX(-1); }
}

/* Druga slika c05 - Potpuno drugačiji tajming i smerovi */
img.c05:nth-of-type(2) { width:170px; animation: swim05_2 48s infinite ease-in-out; }
@keyframes swim05_2{
    0%{ left:-20%; top:75%; }
    25%{ left:30%; top:30%; }
    60%{ left:75%; top:80%; }
    100%{ left:120%; top:20%; }
}

/* Druga slika c06 */
img.c06:nth-of-type(2) { width:120px; animation: swim06_2 64s infinite ease-in-out; }
@keyframes swim06_2{
    0%{ left:110%; top:55%; transform: scaleX(-1); }
    40%{ left:70%; top:15%; }
    80%{ left:25%; top:75%; }
    100%{ left:-20%; top:45%; transform: scaleX(-1); }
}

/* Druga slika c08 */
img.c08:nth-of-type(2) { width:110px; animation: swim08_2 44s infinite ease-in-out; }
@keyframes swim08_2{
    0%{ left:110%; top:35%; transform: scaleX(-1); }
    30%{ left:65%; top:75%; }
    70%{ left:20%; top:20%; }
    100%{ left:-20%; top:60%; transform: scaleX(-1); }
}

/* Druga slika c07 */
img.c07:nth-of-type(2) { width:220px; opacity:.55; animation: swim07_2 82s infinite linear; }
@keyframes swim07_2{
    0%{ left:-40%; top:65%; }
    50%{ left:50%; top:25%; }
    100%{ left:120%; top:55%; }
}
</style>
</head>

<body>

<!-- DUGME SA VAŠOM TAČNOM ADRESOM -->

    <a href="https://radiogalaksija.onrender.com/" target="_blank" class="premium-link">📻 Slušaj Uživo: Radio Galaksija 📻</a>

<div class="ocean">
    <div class="water-light"></div>

    <div class="bubble b1"></div>

    <img class="creature c08" src="https://i.imgur.com/ljHMWjF.gif">
    <img class="creature c09" src="https://i.imgur.com/QQGiehf.gif">

</div>

</body>
</html>
