<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Deep Ocean XAT</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}


.ocean{

position:fixed;
inset:0;

overflow:hidden;

background:
linear-gradient(
180deg,
#0088cc 0%,
#00527a 35%,
#002744 70%,
#000914 100%
);

}


/* SVETLOSNI ZRACI */

.light{

position:absolute;
top:-30%;
left:-20%;

width:140%;
height:90%;

background:
linear-gradient(
120deg,
transparent 35%,
rgba(255,255,255,.18),
transparent 60%
);

animation:lightMove 15s infinite alternate;

}


@keyframes lightMove{

from{transform:translateX(-100px);}
to{transform:translateX(100px);}

}


/* TALASI */

.wave{

position:absolute;
inset:0;

background:
repeating-linear-gradient(
45deg,
rgba(0,200,255,.07) 0px,
rgba(0,200,255,.07) 100px,
transparent 200px
);

animation:waveMove 14s infinite alternate;

}


@keyframes waveMove{

from{
transform:scale(1) rotate(-2deg);
}

to{
transform:scale(1.15) rotate(3deg);
}

}


/* MEHURICI */


.bubble{

position:absolute;
bottom:-50px;

border-radius:50%;

background:
rgba(180,240,255,.25);

border:1px solid rgba(255,255,255,.3);

animation:bubble 18s infinite linear;

}


@keyframes bubble{

0%{
transform:translateY(0) translateX(0);
opacity:0;
}

20%{opacity:1;}

100%{
transform:translateY(-120vh) translateX(100px);
opacity:0;
}

}


.b1{width:15px;height:15px;left:10%;animation-duration:15s;}
.b2{width:30px;height:30px;left:30%;animation-duration:25s;}
.b3{width:10px;height:10px;left:55%;animation-duration:12s;}
.b4{width:20px;height:20px;left:80%;animation-duration:20s;}



/* ZIVOTINJE */


.creature{

position:absolute;

pointer-events:none;

filter:drop-shadow(0 0 10px rgba(0,200,255,.5));

}


/* 1 */

.c01{
width:90px;
animation:move01 45s infinite ease-in-out;
}

@keyframes move01{
0%{left:-10%;top:20%;}
25%{left:25%;top:35%;}
50%{left:60%;top:15%;}
75%{left:40%;top:55%;}
100%{left:110%;top:30%;}
}


/* 2 */

.c02{
width:140px;
animation:move02 60s infinite ease-in-out;
}

@keyframes move02{
0%{left:110%;top:60%;}
30%{left:70%;top:30%;}
60%{left:30%;top:70%;}
100%{left:-20%;top:40%;}
}


/* 3 */

.c03{
width:250px;
opacity:.6;
animation:move03 90s infinite linear;
}

@keyframes move03{
0%{left:-30%;top:75%;}
50%{left:50%;top:55%;}
100%{left:120%;top:70%;}
}


/* 4 */

.c04{
width:80px;
animation:move04 38s infinite ease-in-out;
}

@keyframes move04{
0%{left:20%;top:80%;}
50%{left:70%;top:20%;}
100%{left:10%;top:40%;}
}


/* 5 */

.c05{
width:170px;
animation:move05 70s infinite ease-in-out;
}

@keyframes move05{
0%{left:-20%;top:50%;}
50%{left:80%;top:20%;}
100%{left:30%;top:80%;}
}


/* 6 */

.c06{
width:120px;
animation:move06 55s infinite;
}

@keyframes move06{
0%{left:80%;top:80%;}
50%{left:40%;top:30%;}
100%{left:-20%;top:60%;}
}


/* 7 */

.c07{
width:220px;
opacity:.5;
animation:move07 100s infinite;
}

@keyframes move07{
0%{left:120%;top:30%;}
50%{left:50%;top:70%;}
100%{left:-30%;top:20%;}
}


/* 8 */

.c08{
width:100px;
animation:move08 45s infinite;
}

@keyframes move08{
0%{left:0;top:10%;}
50%{left:70%;top:50%;}
100%{left:20%;top:90%;}
}


/* 9 */

.c09{
width:130px;
animation:move09 65s infinite;
}

@keyframes move09{
0%{left:90%;top:10%;}
50%{left:20%;top:60%;}
100%{left:-20%;top:30%;}
}


/* 10 */

.c10{
width:160px;
animation:move10 80s infinite;
}

@keyframes move10{
0%{left:-20%;top:80%;}
50%{left:60%;top:40%;}
100%{left:120%;top:10%;}
}



/* DUBINA */

.depth{

position:absolute;
inset:0;

background:
radial-gradient(
ellipse,
transparent 20%,
rgba(0,0,0,.55)
);

}


</style>

</head>


<body>


<div class="ocean">


<div class="light"></div>

<div class="wave"></div>


<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>
<div class="bubble b4"></div>



<img class="creature c01" src="https://i.imgur.com/AaEWDOs.gif">

<img class="creature c02" src="https://i.imgur.com/3fe3rwn.gif">

<img class="creature c03" src="https://i.imgur.com/PBlkcyw.gif">

<img class="creature c05" src="https://i.imgur.com/2fCJYbt.gif">

<img class="creature c06" src="https://i.imgur.com/MOmJ9VR.gif">

<img class="creature c07" src="https://i.imgur.com/awkNxXg.gif">

<img class="creature c08" src="https://i.imgur.com/NkT0j9G.gif">

<img class="creature c09" src="https://i.imgur.com/ljHMWjF.gif">

<img class="creature c10" src="https://i.imgur.com/QQGiehf.gif">

<img class="creature c01" src="https://i.imgur.com/AqgYZlO.gif">

<img class="creature c05" src="https://i.imgur.com/YgI0sf7.gif">

<img class="creature c07" src="https://i.imgur.com/VZmMgnR.gif">


<div class="depth"></div>


</div>


</body>
</html>
