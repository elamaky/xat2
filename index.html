<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Ocean XAT - Čist CSS Ekosistem</title>

<style>
/* =========================
   OSNOVNI RESET i STRUKTURA
========================= */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: #000c16;
}
@keyframes linkPulse {
    0%, 100% { transform: scale(1); opacity: 0.95; }
    50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 15px rgba(255,106,0,0.6)); }
}

/* =========================
   GLAVNO MORE (DUBINA)
========================= */
.ocean {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 10%, rgba(0,180,240,.35), transparent 45%),
                linear-gradient(180deg, #006fa8 0%, #00466f 35%, #002c4a 70%, #000c16 100%);
}

.water-light {
    position: absolute;
    top: -40%;
    left: -30%;
    width: 160%;
    height: 120%;
    background: radial-gradient(ellipse, rgba(255,255,255,.12), transparent 55%);
    animation: waterGlow 18s infinite alternate;
    pointer-events: none;
}

@keyframes waterGlow {
    0% { transform: translate(-50px, 0) scale(1); opacity: .35; }
    100% { transform: translate(80px, 40px) scale(1.2); opacity: .6; }
}

.depth {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.75));
    pointer-events: none;
    z-index: 20;
}

/* =========================
   POBOLJŠANI MEHURIĆI i ČESTICE VULKANA
========================= */
.bubble {
    position: absolute;
    bottom: -60px;
    border-radius: 50%;
    background: rgba(180,235,255,.18);
    border: 1px solid rgba(255,255,255,.3);
    box-shadow: 0 0 12px rgba(0,180,255,.4);
    animation: bubbleUp linear infinite;
    z-index: 15;
}

@keyframes bubbleUp {
    0% { transform: translateY(0) translateX(0) scale(.7); opacity: 0; }
    10% { opacity: .8; }
    50% { transform: translateY(-60vh) translateX(-25px) scale(1); }
    100% { transform: translateY(-120vh) translateX(35px) scale(1.2); opacity: 0; }
}

.b1 { width: 12px; height: 12px; left: 15%; animation-duration: 18s; }
.b2 { width: 25px; height: 25px; left: 35%; animation-duration: 28s; }
.b3 { width: 8px; height: 8px; left: 60%; animation-duration: 14s; }
.b4 { width: 18px; height: 18px; left: 82%; animation-duration: 22s; }

.vent-particles {
    position: absolute;
    bottom: 0;
    left: 45%;
    width: 10px;
    height: 10px;
    background: rgba(255, 106, 0, 0.6);
    box-shadow: 0 0 20px #ff3300;
    border-radius: 50%;
    animation: ventUp 8s infinite linear;
    z-index: 9;
}
.vp2 { left: 46%; animation-delay: 2s; animation-duration: 6s; background: rgba(255, 230, 0, 0.5); }
.vp3 { left: 44%; animation-delay: 4s; animation-duration: 10s; }

@keyframes ventUp {
    0% { transform: translateY(10px) scale(1); opacity: 1; }
    50% { background: rgba(0, 229, 255, 0.4); box-shadow: 0 0 15px #00e5ff; }
    100% { transform: translateY(-110vh) translateX(100px) scale(3); opacity: 0; }
}
/* =========================
   ČIST CSS EKOSISTEM (STRUKTURA I ANATOMIJA)
========================= */
/* 4. UNAPREĐENO JATO RIBA */
.school-container {
    position: absolute;
    width: 250px;
    height: 180px;
    animation: schoolOceanSwim 28s infinite ease-in-out;
    z-index: 15;
    pointer-events: none;
}
.school-fish {
    position: absolute;
    width: 16px;
    height: 9px;
    background: linear-gradient(90deg, #00f0ff, #0072ff);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
    animation: fishMicroWiggle 2s infinite ease-in-out alternate;
}
.school-fish::after {
    content: '';
    position: absolute;
    right: -4px;
    top: 2px;
    border-top: 2px solid transparent;
    border-bottom: 2px solid transparent;
    border-left: 5px solid #00f0ff;
}
.sf1 { top: 20px; left: 30px; animation-delay: -0.2s; transform: scale(1.1); }
.sf2 { top: 40px; left: 10px; animation-delay: -0.5s; transform: scale(0.9); }
.sf3 { top: 15px; left: 70px; animation-delay: -0.1s; transform: scale(1); }
.sf4 { top: 60px; left: 50px; animation-delay: -0.7s; transform: scale(0.85); }
.sf5 { top: 80px; left: 20px; animation-delay: -0.4s; transform: scale(1.05); }
.sf6 { top: 50px; left: 90px; animation-delay: -0.3s; transform: scale(0.95); }

/* 5. MEDUZE, ZVEZDA I TRAVA */
.jellyfish {
    position: absolute;
    width: 40px;
    height: 40px;
    background: rgba(0, 229, 255, 0.4);
    border-radius: 50% 50% 40% 40%;
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.8), inset 0 5px 10px #fff;
    animation: jellySwim 25s infinite linear, jellyPulse 2s infinite ease-in-out;
    z-index: 8;
    pointer-events: none;
}
.jellyfish::before, .jellyfish::after {
    content: '';
    position: absolute;
    bottom: -20px;
    width: 2px;
    height: 25px;
    background: linear-gradient(180deg, rgba(0,229,255,0.7), transparent);
}
.jellyfish::before { left: 12px; animation: tentacle 1s infinite alternate; }
.jellyfish::after { right: 12px; animation: tentacle 1.2s infinite alternate-reverse; }
.j1 { left: 20%; bottom: -80px; transform: scale(0.8); }
.j2 { left: 75%; bottom: -80px; animation-duration: 35s, 2.5s; animation-delay: 4s, 0.5s; transform: scale(1.3); filter: hue-rotate(50deg); }

.starfish {
    position: absolute;
    bottom: 20px;
    right: 40px;
    width: 35px;
    height: 35px;
    background: #ff456a;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    filter: drop-shadow(0 0 10px rgba(255, 69, 106, 0.6));
    animation: starfishGlow 4s infinite alternate ease-in-out;
    z-index: 21;
}
.seaweed {
    position: absolute;
    bottom: -10px;
    width: 8px;
    height: 120px;
    background: linear-gradient(0deg, #002c4a, #00e5ff);
    border-radius: 8px 8px 0 0;
    opacity: 0.4;
    transform-origin: bottom center;
    animation: weedSway 4s infinite alternate ease-in-out;
    z-index: 6;
}
.sw1 { left: 5%; height: 140px; animation-duration: 3.5s; }
.sw2 { left: 91%; height: 160px; animation-duration: 5s; }

/* =========================
   MORSKE ŽIVOTINJE (KLASE ZA ORIGINALNE GIF-ove)
========================= */
.creature {
    position: absolute;
    pointer-events: none;
    z-index: 10;
    filter: drop-shadow(0 0 8px rgba(0,180,255,.45));
    will-change: transform, left, top;
}
.c01 { width: 100px; animation: swim01 42s infinite ease-in-out; }
.c02 { width: 140px; animation: swim02 55s infinite ease-in-out; transform: scaleX(-1); }
.c03 { width: 260px; opacity: .45; animation: swim03 90s infinite linear; }
.c04 { width: 90px; animation: swim04 38s infinite ease-in-out; }
.c05 { width: 170px; animation: swim05 70s infinite ease-in-out; }
.c06 { width: 120px; animation: swim06 60s infinite ease-in-out; transform: scaleX(-1); }
.c07 { width: 220px; opacity: .55; animation: swim07 100s infinite linear; }
.c08 { width: 110px; animation: swim08 50s infinite ease-in-out; transform: scaleX(-1); }
.c09 { width: 130px; animation: swim09 65s infinite ease-in-out; }
.c10 { width: 160px; animation: swim10 75s infinite ease-in-out; transform: scaleX(-1); }
.c11 { width: 140px; animation: swim11 58s infinite ease-in-out; transform: scaleX(-1); }
.c12 { width: 150px; animation: swim12 64s infinite ease-in-out; transform: scaleX(-1); }
.c13 { width: 110px; animation: swim13 52s infinite ease-in-out; }
.c14 { width: 130px; animation: swim14 48s infinite ease-in-out; transform: scaleX(-1); }

/* =========================
   ANIMACIJE KRETANJA (SVI ELEMENTI)
========================= */

/* Kretanje celog jata riba po ekranu */
@keyframes schoolOceanSwim {
    0% { left: -300px; top: 25%; }
    25% { top: 45%; }
    50% { left: 45%; top: 15%; }
    75% { top: 35%; }
    100% { left: 110%; top: 30%; }
}
/* Mikro-mrdanje ribica u jatu */
@keyframes fishMicroWiggle {
    0% { transform: translateY(0) rotate(-4deg); }
    100% { transform: translateY(6px) rotate(4deg); }
}

/* Talasasta prirodna putanja za CSS Sirenu */
@keyframes mermaidNaturalSwim {
    0% { left: -150px; top: 45%; transform: scaleX(1); }
    49% { transform: scaleX(1); }
    50% { left: 110%; top: 25%; transform: scaleX(-1); }
    99% { transform: scaleX(-1); }
    100% { left: -150px; top: 45%; transform: scaleX(1); }
}
@keyframes tailWag {
    0% { transform: rotate(-8deg); }
    100% { transform: rotate(8deg); }
}
@keyframes sparkleTrace {
    0% { left: -150px; top: 47%; opacity: 0; }
    50% { opacity: 1; }
    100% { left: 110%; top: 27%; opacity: 0; }
}

@keyframes finFlap {
    0% { transform: rotate(15deg); }
    100% { transform: rotate(50deg); }
}

@keyframes clawsSnip {
    0% { transform: rotate(-10deg); }
    100% { transform: rotate(15deg); }
}

/* Animacije meduza, trava i zvezde */
@keyframes jellySwim {
    0% { bottom: -100px; transform: translateX(0); }
    50% { transform: translateX(40px); }
    100% { bottom: 115%; transform: translateX(-40px); }
}
@keyframes jellyPulse {
    0%, 100% { height: 40px; border-radius: 50% 50% 40% 40%; }
    50% { height: 32px; border-radius: 50% 50% 25% 25%; }
}
@keyframes tentacle {
    0% { height: 20px; transform: skewX(-5deg); }
    100% { height: 30px; transform: skewX(5deg); }
}
@keyframes weedSway {
    0% { transform: rotate(-5deg); }
    100% { transform: rotate(5deg); }
}
@keyframes starfishGlow {
    0% { filter: drop-shadow(0 0 5px rgba(255, 69, 106, 0.4)); }
    100% { filter: drop-shadow(0 0 15px rgba(255, 69, 106, 0.9)); }
}

/* Prirodne talasaste putanje za tvoje originalne GIF slike */
@keyframes swim01 {
    0% { left: -10%; top: 30%; }
    50% { left: 50%; top: 40%; }
    100% { left: 110%; top: 35%; }
}
@keyframes swim02 {
    0% { left: 110%; top: 55%; }
    50% { left: 45%; top: 65%; }
    100% { left: -20%; top: 50%; }
}
@keyframes swim03 {
    0% { left: -30%; top: 68%; }
    100% { left: 120%; top: 72%; }
}
@keyframes swim04 {
    0% { left: -10%; top: 78%; }
    50% { left: 55%; top: 60%; }
    100% { left: 110%; top: 72%; }
}
@keyframes swim05 {
    0% { left: -20%; top: 42%; }
    50% { left: 60%; top: 32%; }
    100% { left: 120%; top: 38%; }
}
@keyframes swim06 {
    0% { left: 110%; top: 22%; }
    50% { left: 50%; top: 38%; }
    100% { left: -20%; top: 27%; }
}
@keyframes swim07 {
    0% { left: -40%; top: 22%; }
    100% { left: 120%; top: 33%; }
}
@keyframes swim08 {
    0% { left: 110%; top: 78%; }
    50% { left: 50%; top: 60%; }
    100% { left: -20%; top: 72%; }
}
@keyframes swim09 {
    0% { left: -20%; top: 58%; }
    50% { left: 55%; top: 72%; }
    100% { left: 110%; top: 52%; }
}
@keyframes swim10 {
    0% { left: 110%; top: 18%; }
    50% { left: 55%; top: 32%; }
    100% { left: -20%; top: 22%; }
}
@keyframes swim11 {
    0% { left: 110%; top: 82%; }
    50% { left: 45%; top: 72%; }
    100% { left: -20%; top: 62%; }
}
@keyframes swim12 {
    0% { left: 110%; top: 12%; }
    50% { left: 50%; top: 32%; }
    100% { left: -20%; top: 38%; }
}
@keyframes swim13 {
    0% { left: -20%; top: 72%; }
    50% { left: 45%; top: 62%; }
    100% { left: 110%; top: 67%; }
}
@keyframes swim14 {
    0% { left: 110%; top: 42%; }
    50% { left: 50%; top: 52%; }
    100% { left: -20%; top: 38%; }
}
</style>
</head>
<body>

<div class="ocean">
    <div class="water-light"></div>

    <!-- Mehurići -->
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>

    <!-- Čestice podvodnog vulkana -->
    <div class="vent-particles vp1"></div>
    <div class="vent-particles vp2"></div>
    <div class="vent-particles vp3"></div>

    <!-- Morske trave na dnu -->
    <div class="seaweed sw1"></div>
    <div class="seaweed sw2"></div>

    <!-- Pulsirajuće Meduze -->
    <div class="jellyfish j1"></div>
    <div class="jellyfish j2"></div>

    <!-- UNAPREĐENO JATO RIBA (Čist CSS oblik) -->
    <div class="school-container">
        <div class="school-fish sf1"></div>
        <div class="school-fish sf2"></div>
        <div class="school-fish sf3"></div>
        <div class="school-fish sf4"></div>
        <div class="school-fish sf5"></div>
        <div class="school-fish sf6"></div>
    </div>

      <!-- TVOJE ORIGINALNE GIF SLIKE (CREATURES) -->
   <img class="creature c01" src="https://i.imgur.com/AaEWDOs.gif" alt="Creature">

    <img class="creature c03" src="https://i.imgur.com/PBlkcyw.gif" alt="Creature">
    <img class="creature c04" src="https://i.imgur.com/2fCJYbt.gif" alt="Creature">
    <img class="creature c05" src="https://i.imgur.com/MOmJ9VR.gif" alt="Creature">
    <img class="creature c06" src="https://i.imgur.com/awkNxXg.gif" alt="Creature">
    <img class="creature c07" src="https://i.imgur.com/NkT0j9G.gif" alt="Creature">
    <img class="creature c08" src="https://i.imgur.com/ljHMWjF.gif" alt="Creature">
    <img class="creature c09" src="https://i.imgur.com/QQGiehf.gif" alt="Creature">
    <img class="creature c10" src="https://i.imgur.com/AqgYZlO.gif" alt="Creature">
    <img class="creature c11" src="https://i.imgur.com/YgI0sf7.gif" alt="Creature">

    <img class="creature c13" src="https://i.imgur.com/z494fsE.gif" alt="Creature">
    <img class="creature c14" src="https://i.imgur.com/VZmMgnR.gif" alt="Creature">

    <!-- Detalji na samom dnu -->
    <div class="starfish"></div>
    <div class="depth"></div>
</div>
